name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      part:
        description: 'Version part to bump (from latest release tag)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install uglifyjs
        run: npm install -g uglify-js
      - name: Run build
        run: |
          python build.py 1.0.0

  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install uglifyjs
        run: npm install -g uglify-js
      - name: Bump, build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          part="${{ inputs.part }}"
          case "$part" in
            major|minor|patch) ;;
            *) echo "Invalid part: $part" >&2; exit 1 ;;
          esac
          latest="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          published="$(gh release list --limit 1 --json publishedAt --jq '.[0].publishedAt')"
          if [ -z "$latest" ] || [ "$latest" = "null" ]; then
            latest="0.0.0"
          fi
          if [ "$published" = "null" ]; then
            published=""
          fi
          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          case "$part" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="$major.$minor.$patch"
          echo "Previous release: $latest -> new version: $new"
          python3 build.py "$new"
          notes=""
          if git fetch origin tag "$latest" 2>/dev/null && git rev-parse --verify "$latest" >/dev/null 2>&1; then
            if [ -n "$published" ]; then
              notes="$(git log --since="$published" "$latest"..HEAD --format='- %s')"
            else
              notes="$(git log "$latest"..HEAD --format='- %s')"
            fi
          fi
          if [ -z "$notes" ]; then
            notes="Bug fixes and improvements."
          fi
          gh release create "$new" \
              "mod_event_qrscan_$new.zip" \
              event_qrscan_update.xml \
              --title "Release $new" \
              --notes "$notes"
